name: Phase 7 owned-fixture dashboard gate

on:
  workflow_dispatch:
    inputs:
      affected_only:
        description: Rerun only the dashboard walkthrough after a UI fix
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: phase7-dashboard
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      FRICTIONLAB_BROWSER_PATH: /usr/bin/google-chrome
      FRICTIONLAB_PHASE7_EVIDENCE: artifacts/phase7/validation
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked free/open-source dependencies
        run: |
          python -m pip install uv==0.11.18
          uv sync --locked --extra dashboard --group dev

      - name: One post-build dashboard acceptance batch
        if: ${{ !inputs.affected_only }}
        run: uv run --extra dashboard pytest -q tests/phase_07 tests/phase_06/test_audit.py::test_api_latest_revision_human_disposition_and_no_target_revisit

      - name: Affected dashboard walkthrough only
        if: ${{ inputs.affected_only }}
        run: uv run --extra dashboard pytest -q tests/phase_07

      - name: Review saved UI and audit evidence offline
        if: always()
        run: uv run --extra dashboard python scripts/review_phase7.py

      - name: Upload synthetic dashboard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-owned-fixture-dashboard-evidence
          path: artifacts/phase7/validation/
          if-no-files-found: warn
          retention-days: 7
