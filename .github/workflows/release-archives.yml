name: Final source and wheel archives
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archives:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify portable Python archives
        run: |
          python -m pip install uv==0.11.18
          uv build
          python scripts/verify_release_archives.py
          sha256sum dist/*.whl dist/*.tar.gz > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: final-source-wheel-and-checksums
          path: dist/
          retention-days: 14
