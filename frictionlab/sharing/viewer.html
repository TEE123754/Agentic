<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>FrictionLab · Portable audit</title>
  <style>
    :root{color-scheme:light;font:16px system-ui,sans-serif;background:#f5f7fb;color:#14253e}
    *{box-sizing:border-box}body{margin:0}header{background:#152744;color:#fff;padding:24px max(24px,calc((100vw - 1200px)/2))}
    header h1{margin:0 0 6px;font-size:1.8rem}header p{margin:0;color:#d0def2}main{max-width:1200px;margin:auto;padding:24px}
    .card{background:#fff;border:1px solid #dce4f1;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #14253e0a}
    .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.metric{min-width:140px;flex:1}.metric strong{display:block;font-size:1.5rem}
    .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}.tabs button,.controls button{background:#e8eef8;border:0;border-radius:8px;padding:9px 13px;cursor:pointer}
    .tabs button[aria-selected="true"]{background:#3159ba;color:#fff}section[hidden]{display:none}label{font-weight:650;display:block;margin:8px 0}
    select,input[type=file]{font:inherit;max-width:100%;padding:7px;border:1px solid #bac8df;border-radius:7px;background:#fff}
    .finding{border-left:5px solid #405fb9}.finding.high,.finding.critical{border-color:#bf3c50}.muted{color:#5c6e86;font-size:.9rem}
    .media{max-width:100%;max-height:550px;border:1px solid #dce4f1;border-radius:8px}.step{min-height:72px}
    .heat-stage{position:relative;max-width:650px;background:#e8eef8;border:1px solid #c4d0e4;overflow:hidden}
    .heat-stage img{display:block;width:100%;height:100%;object-fit:fill;max-height:none;border:0;border-radius:0}.dot{position:absolute;width:19px;height:19px;border-radius:50%;background:#e74652aa;border:2px solid #a01d29;transform:translate(-50%,-50%)}
    .dot.rage{background:#ffb231dd;border-color:#8e4a00}.bar{height:14px;background:#dbe6fa;border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:#3a69c8}
    .error{color:#9b2235;font-weight:650}.pill{display:inline-block;padding:4px 8px;border-radius:8px;background:#e7eef9;margin:3px}pre{white-space:pre-wrap;overflow-wrap:anywhere}
    @media(max-width:700px){main{padding:12px}.metric{min-width:110px}header{padding:20px 12px}}
  </style>
</head>
<body>
  <header><h1>FrictionLab portable audit</h1><p>Saved synthetic evidence · offline viewer · no target website connection</p></header>
  <main>
    <div class="card"><div class="row"><div><strong id="run-title">Loading saved audit…</strong><div class="muted" id="run-meta"></div></div><label for="import-file">Open a local private bundle <input id="import-file" type="file" accept=".json,application/json"></label></div><p id="import-status" class="muted">A private import stays in this browser tab; it is not uploaded.</p></div>
    <nav class="tabs" aria-label="Audit views"><button data-tab="overview" aria-selected="true">Overview</button><button data-tab="findings" aria-selected="false">Findings</button><button data-tab="trajectory" aria-selected="false">Trajectories</button><button data-tab="heatmap" aria-selected="false">Heatmaps</button><button data-tab="full" aria-selected="false">Full report</button></nav>
    <section id="overview"></section><section id="findings" hidden></section><section id="trajectory" hidden></section><section id="heatmap" hidden></section><section id="full" hidden></section>
  </main>
  <script id="embedded-data" type="application/json">__FRICTIONLAB_EMBEDDED_JSON__</script>
  <script>
    'use strict';
    const $=id=>document.getElementById(id);
    const node=(tag,text,className)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);if(className)n.className=className;return n};
    const card=()=>node('div',undefined,'card');
    let audit=null,stepIndex=0;
    function valid(data){
      if(!data||data.schema_version!==1||!data.manifest||!data.overview||!Array.isArray(data.findings)||!Array.isArray(data.sessions)||!Array.isArray(data.heatmaps)||!data.assets)return false;
      if(data.findings.length>100||data.sessions.length>6||data.heatmaps.length>30||Object.keys(data.assets).length>48)return false;
      return Object.values(data.assets).every(value=>typeof value==='string'&&/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(value)&&value.length<2800000);
    }
    function photo(id,alt){const src=audit.assets[id];if(!src)return null;const image=node('img');image.src=src;image.alt=alt;image.className='media';image.loading='lazy';return image}
    function metric(parent,label,value){const box=node('div',undefined,'metric');box.append(node('span',label,'muted'),node('strong',value));parent.append(box)}
    function renderOverview(){const root=$('overview');root.replaceChildren();const a=audit.overview;const top=card();top.append(node('h2','Audit overview'),node('p',a.summary));const row=node('div',undefined,'row');metric(row,'Requested',a.requested);metric(row,'Executed',a.executed);metric(row,'Eligible',a.eligible);metric(row,'Report',a.report_status);top.append(row,node('p','Terminal reason: '+a.terminal_reason,'muted'));root.append(top);
      const outcome=card();outcome.append(node('h2','Synthetic outcomes'));for(const [name,count] of Object.entries(a.outcomes||{}))outcome.append(node('span',name+': '+count,'pill'));root.append(outcome);
      const funnel=card();funnel.append(node('h2','Milestone funnel'));if(!a.funnel.length)funnel.append(node('p','No eligible milestone denominator.'));for(const item of a.funnel){funnel.append(node('p',item.journey+' · '+item.milestone+' — '+item.passed+'/'+item.eligible));const outer=node('div',undefined,'bar');const inner=node('span');inner.style.width=(item.eligible?Math.min(100,100*item.passed/item.eligible):0)+'%';outer.append(inner);funnel.append(outer)}root.append(funnel);
      const protection=card();protection.append(node('h2','Protection and limitations'),node('p','Observed boundary: '+a.protection.boundary+' · sentinel requests: '+a.protection.sentinel_requests+' · sentinel data unchanged: '+a.protection.sentinel_data_unchanged),node('p','Evidence review: '+a.review_status));for(const item of a.limitations||[])protection.append(node('p',item,'muted'));for(const item of a.exclusions||[])protection.append(node('p','Excluded: '+item,'muted'));root.append(protection)}
    function renderFindings(){const root=$('findings');root.replaceChildren();const controls=card();const label=node('label','Filter severity');const select=node('select');select.setAttribute('aria-label','Filter severity');for(const value of ['all','critical','high','medium','low']){const option=node('option',value);option.value=value;select.append(option)}label.append(select);controls.append(label);root.append(controls);const list=node('div');root.append(list);
      const draw=()=>{list.replaceChildren();const chosen=audit.findings.filter(f=>select.value==='all'||f.severity===select.value);if(!chosen.length)list.append(node('p','No findings match this filter.'));for(const f of chosen){const c=card();c.classList.add('finding',f.severity);c.append(node('h2',f.title),node('p',f.severity.toUpperCase()+' · '+f.affected+'/'+f.eligible+' eligible synthetic sessions · confidence '+f.confidence,'muted'),node('h3','Observed'),node('p',f.observed),node('h3','Possible mechanism'),node('p',f.mechanism),node('h3','Recommended change'),node('p',f.recommendation),node('h3','Verify'),node('p',f.verification),node('p','Profiles: '+f.profiles.join(', '),'muted'));for(const id of f.evidence){const img=photo(id,'Saved masked finding evidence');if(img)c.append(img)}list.append(c)}};select.addEventListener('change',draw);draw()}
    function renderTrajectory(){const root=$('trajectory');root.replaceChildren();const c=card();c.append(node('h2','Saved trajectory playback'));if(!audit.sessions.length){c.append(node('p','No saved session trajectory.'));root.append(c);return}const select=node('select');select.setAttribute('aria-label','Choose session');audit.sessions.forEach((s,i)=>{const o=node('option',s.persona+' · '+s.journey+' · '+s.outcome);o.value=String(i);select.append(o)});c.append(select);const status=node('p');const controls=node('div',undefined,'controls row');const previous=node('button','Previous step');const next=node('button','Next step');controls.append(previous,next);const display=node('div',undefined,'step');c.append(status,controls,display);root.append(c);
      const draw=()=>{const session=audit.sessions[Number(select.value)];const steps=session.steps||[];stepIndex=Math.max(0,Math.min(stepIndex,steps.length-1));display.replaceChildren();status.textContent='Session '+session.id+' · '+session.outcome+(session.diagnosis?' · '+session.diagnosis:'');if(!steps.length){display.append(node('p','No browser steps were saved.'));return}const step=steps[stepIndex];display.append(node('h3','Step '+(stepIndex+1)+' of '+steps.length+' · '+step.action+' → '+step.result),node('p',step.detail),node('p','Patience after action: '+(step.patience??'not recorded'),'muted'));const img=photo(step.image,'Saved masked screenshot after step '+(stepIndex+1));if(img)display.append(img)};select.addEventListener('change',()=>{stepIndex=0;draw()});previous.addEventListener('click',()=>{stepIndex--;draw()});next.addEventListener('click',()=>{stepIndex++;draw()});draw()}
    function renderHeatmap(){const root=$('heatmap');root.replaceChildren();const c=card();c.append(node('h2','Synthetic click heatmaps'));if(!audit.heatmaps.length){c.append(node('p','No compatible saved heatmap.'));root.append(c);return}const select=node('select');select.setAttribute('aria-label','Choose heatmap');audit.heatmaps.forEach((g,i)=>{const o=node('option',g.route+' · '+g.input_mode+' · '+g.width+'×'+g.height);o.value=String(i);select.append(o)});c.append(select);const info=node('p');const stage=node('div',undefined,'heat-stage');c.append(info,stage);root.append(c);const draw=()=>{const group=audit.heatmaps[Number(select.value)];stage.replaceChildren();stage.style.aspectRatio=String(group.width)+' / '+String(group.height);const img=photo(group.background,'Saved masked screenshot under synthetic click positions');if(img)stage.append(img);for(const point of group.points){const dot=node('span',undefined,'dot'+(point.rage?' rage':''));dot.style.left=(100*point.x/group.width)+'%';dot.style.top=(100*point.y/group.height)+'%';dot.title=point.target+' · '+point.result;stage.append(dot)}info.textContent=group.points.length+' synthetic clicks · '+group.rage_clusters+' repeated-failure clusters. No human traffic is represented.'};select.addEventListener('change',draw);draw()}
    function renderFull(){const root=$('full');root.replaceChildren();const c=card();c.append(node('h2','Complete sanitized report'));const withoutPixels={manifest:audit.manifest,overview:audit.overview,findings:audit.findings,sessions:audit.sessions,heatmaps:audit.heatmaps,embedded_masked_images:Object.keys(audit.assets).length};c.append(node('pre',JSON.stringify(withoutPixels,null,2)));root.append(c)}
    function render(data){if(!valid(data))throw new Error('Bundle format or image data is invalid');audit=data;$('run-title').textContent='Run '+data.manifest.run_id;$('run-meta').textContent='Revision '+data.manifest.revision+' · '+data.manifest.visibility+' · '+data.manifest.source;renderOverview();renderFindings();renderTrajectory();renderHeatmap();renderFull()}
    document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{for(const tab of document.querySelectorAll('[data-tab]')){const active=tab===button;tab.setAttribute('aria-selected',String(active));$(tab.dataset.tab).hidden=!active}}));
    $('import-file').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;const status=$('import-status');if(file.size>20*1024*1024){status.textContent='Rejected: bundle exceeds 20 MiB.';status.className='error';return}try{const parsed=JSON.parse(await file.text());render(parsed);status.textContent='Opened private local bundle: '+file.name+'. No upload occurred.';status.className='muted'}catch(error){status.textContent='Rejected: '+error.message;status.className='error'}});
    try{render(JSON.parse($('embedded-data').textContent))}catch(error){$('run-title').textContent='Bundle unavailable';$('import-status').textContent='Open a valid local bundle to inspect this audit.';$('import-status').className='error'}
  </script>
</body>
</html>
